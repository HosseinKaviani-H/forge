# Multi-Node SFT Configuration for Qwen3-32B
# >>> python -m apps.sft.main --config apps/sft/qwen3_32b_multinode.yaml

# TODO: required by torchtitan
# https://github.com/pytorch/torchtitan/blob/2f1c814da071cc8ad165d00be6f9c1a66f8e1cce/torchtitan/distributed/utils.py#L265
comm:
  trace_buf_size: 0

model_name: "Qwen/Qwen3-32B"

# Provisioner configuration for multi-node support
provisioner:
  launcher: slurm  # Options: slurm, local, torchrun

model:
  name: qwen3
  flavor: 32B
  hf_assets_path: hf://${model_name}

# Resource allocation for multi-node training
actors:
  trainer:
    procs: 8              # Number of GPU processes per node
    hosts: 2              # Number of nodes to use (multi-node!)
    with_gpus: true
    mesh_name: trainer

optimizer:
  name: AdamW
  lr: 1e-5
  eps: 1e-8

lr_scheduler:
  warmup_steps: 200

training:
  local_batch_size: 1    # Batch size per GPU
  seq_len: 2048
  max_norm: 1.0
  steps: 10000
  compile: false
  dataset: "c4"
  eval_interval: 500     # Run evaluation every N steps
  eval_steps: 100        # Number of validation batches per eval

parallelism:
  data_parallel_replicate_degree: 1
  data_parallel_shard_degree: -1   # Auto-compute: uses all GPUs for FSDP
  tensor_parallel_degree: 1
  pipeline_parallel_degree: 1
  context_parallel_degree: 1
  expert_parallel_degree: 1
  disable_loss_parallel: false

checkpoint:
  enable: true
  initial_load_path: hf://${model_name}
  initial_load_in_hf: true
  last_save_in_hf: true
  interval: 500
  async_mode: "disabled"

activation_checkpoint:
  mode: selective
  selective_ac_option: op

# Optional: Metric logging configuration
